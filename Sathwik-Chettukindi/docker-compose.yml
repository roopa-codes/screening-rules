services:
  postgres:
    image: postgres:16-alpine
    container_name: job-service-postgres
    environment:
      POSTGRES_DB: jobservice
      POSTGRES_USER: ${DB_USER:-jobservice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobservice}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: job-service-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name job-events.fifo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
