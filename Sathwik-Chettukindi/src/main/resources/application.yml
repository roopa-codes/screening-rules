spring:
  application:
    name: job-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobservice}
    username: ${DB_USER:jobservice}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          jwk-set-uri: ${JWT_JWKS_URI:}

app:
  db:
    lock-timeout-ms: ${DB_LOCK_TIMEOUT_MS:5000}
    statement-timeout-ms: ${DB_STATEMENT_TIMEOUT_MS:10000}
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
    queue-url: ${SQS_QUEUE_URL:}
    dlq-arn: ${SQS_DLQ_ARN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
